<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سایت‌پَک | مدیریت مصالح پروژه</title>
    <meta name="theme-color" content="#0284c7" />
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Material_Tracker.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        خطایی رخ داد. لطفاً صفحه را دوباره بارگذاری کنید.
        <a href="." class="reload">بارگذاری دوباره</a>
        <button class="dismiss" aria-label="بستن پیام خطا">×</button>
    </div>
    <script src="js/sitepack.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        Blazor.start().then(() => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(new URL('./service-worker.js', document.baseURI), {
                    scope: new URL('./', document.baseURI).href,
                    updateViaCache: 'none'
                }).catch(error => console.warn('ثبت سرویس آفلاین انجام نشد.', error));
            }
        });
    </script>
</body>

</html>
